<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- dsh-wsl icon: Tux in the classic Linux silhouette (black body, white
       belly and face, orange beak and feet) on a light tile, with a "W"
       badge carrying the plugin's identity. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#dde2e8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- feet -->
  <ellipse cx="25" cy="54" rx="8" ry="3.6" fill="#f4a915"/>
  <ellipse cx="39" cy="54" rx="8" ry="3.6" fill="#f4a915"/>

  <!-- body -->
  <path d="M32 5 C22.5 5 17 13 17 23 c0 6.5 2 10.5 3.2 14.5 1.4 4.8 1 7.6-2.2 11.5 h28 c-3.2-3.9-3.6-6.7-2.2-11.5 C45 33.5 47 29.5 47 23 47 13 41.5 5 32 5 Z" fill="#141414"/>

  <!-- wings -->
  <path d="M17.4 26 c-3.6 3.4-5.4 9-3.6 13.6 .9 2.3 3 2 3.9-.8 1.2-3.7 1-8 1-12.2 Z" fill="#141414"/>
  <path d="M46.6 26 c3.6 3.4 5.4 9 3.6 13.6 -.9 2.3-3 2-3.9-.8 -1.2-3.7-1-8-1-12.2 Z" fill="#141414"/>

  <!-- belly -->
  <path d="M32 21 c-5.6 0-8.6 5.6-8.6 11.6 0 7.6 3.8 13.4 8.6 13.4 s8.6-5.8 8.6-13.4 C40.6 26.6 37.6 21 32 21 Z" fill="#ffffff"/>

  <!-- face patches and eyes -->
  <circle cx="26.6" cy="15.6" r="6" fill="#ffffff"/>
  <circle cx="37.4" cy="15.6" r="6" fill="#ffffff"/>
  <circle cx="28.4" cy="15.4" r="2" fill="#141414"/>
  <circle cx="35.6" cy="15.4" r="2" fill="#141414"/>

  <!-- beak -->
  <path d="M27.4 18.6 h9.2 c.6 0 .9.7.4 1.1 L32.9 23.6 a1.2 1.2 0 0 1-1.8 0 L27 19.7 c-.5-.4-.2-1.1.4-1.1 Z" fill="#f4a915"/>

  <!-- W badge -->
  <circle cx="47" cy="47" r="11" fill="#17191d"/>
  <text x="47" y="51.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#f5f7fa">W</text>
</svg>
